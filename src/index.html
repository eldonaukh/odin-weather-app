<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Weather App</title>
  </head>
  <body>
    <h1>Odin Weather App</h1>
    <form id="weather-form" action="">
      <div class="location">
        <label for="location">Search location</label>
        <input type="text" id="location" name="location" />
      </div>

      <fieldset>
        <legend>Select unit</legend>
        <label>
          <input type="radio" name="unit" value="us" checked />
          Fahrenheit
        </label>

        <label>
          <input type="radio" name="unit" value="metric" />
          Celsius
        </label>
      </fieldset>

      <button type="submit">Submit</button>
    </form>
    <div id="result">
      <div id="current"></div>
      <div id="future"></div>
    </div>
  </body>
</html>
