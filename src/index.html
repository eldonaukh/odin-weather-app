<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Weather App</title>
  </head>
  <body>
    <h1>Odin Weather App</h1>
    <form id="weather-form" action="">
      <div class="location">
        <label for="location">Search location</label>
        <input type="text" id="location" name="location" />
      </div>

      <fieldset>
        <legend>Select unit</legend>
        <label for="fahrenheit">Fahrenheit</label>
        <input
          type="radio"
          name="fahrenheit"
          id="fahrenheit"
          value="us"
          checked
        />
        <label for="celsius">Celsius</label>
        <input type="radio" name="celsius" id="celsius" value="metric" />
      </fieldset>

      <button type="submit">Submit</button>
    </form>
    <div id="result">
      <div id="current"></div>
      <div id="future"></div>
    </div>
  </body>
</html>
